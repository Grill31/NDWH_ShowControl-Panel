<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NDHS Show Control - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center;">
  <div class="center-box">
    <h2 style="color: var(--nd-gold); margin-bottom: 20px;">OPERATOR AUTHENTICATION</h2>
    <form action="3-home.html">
      <div class="form-group">
        <label>Operator ID / Username</label>
        <input type="text" placeholder="Enter Operator ID" required>
      </div>
      <div class="form-group">
        <label>Access Pin / Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-action" style="width: 100%; margin-top: 10px;">AUTHENTICATE</button>
    </form>
  </div>
</body>
</html>
