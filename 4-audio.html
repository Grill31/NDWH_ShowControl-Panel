<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NDHS Show Control - Panel 2 (Audio)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand-section"><h1>NOTRE DAME AUDIO CONTROL</h1></div>
    <nav class="nav-buttons">
      <a href="3-home.html" class="nav-btn back-btn">⬅ BACK (HOME)</a>
      <a href="4-audio.html" class="nav-btn active">🔊 AUDIO</a>
      <a href="5-lighting.html" class="nav-btn">💡 LIGHTING</a>
      <a href="6-video.html" class="nav-btn">📹 VIDEO</a>
      <a href="7-reporting.html" class="nav-btn">📊 REPORTING</a>
      <a href="8-services.html" class="nav-btn">⚙️ SERVICES</a>
      <a href="9-settings.html" class="nav-btn">🔧 SETTINGS</a>
    </nav>
  </header>
  <main class="viewport">
    <div class="grid-2x2">
      <div class="card">
        <div class="card-title">Main Audio Track Playout</div>
        <p style="font-size: 0.9rem; margin-bottom: 10px;">Current Track: <strong>02 - Big Blue World</strong></p>
        <div style="display:flex; gap:10px; margin-bottom: 15px;">
          <button class="btn-action" style="flex:1;">▶ PLAY / GO</button>
          <button class="btn-warning" style="flex:1;">⏸ PAUSE</button>
          <button class="btn-danger" style="flex:1;">⏹ STOP</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Stage Manager Paging & VOG</div>
        <button class="btn-action" style="background:#8e44ad; padding: 20px; margin-bottom: 10px;">PUSH TO TALK (STAGE VOG)</button>
        <button class="btn-action" style="background:#2980b9;">PAGE DRESSING ROOMS</button>
      </div>
      <div class="card" style="grid-column: span 2;">
        <div class="card-title">Console Master Bus Mutes</div>
        <div style="display:flex; gap:15px;">
          <button class="btn-danger" style="flex:1;">MUTE ALL TRACKS</button>
          <button class="btn-danger" style="flex:1;">MUTE WIRELESS MICS</button>
          <button class="btn-danger" style="flex:1;">MUTE HOUSE / LOBBY</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
